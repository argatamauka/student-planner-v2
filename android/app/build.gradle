plugins {
    id 'com.android.application'
}

// permanent-release-trigger: 2.2.4

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def hasReleaseSigning = releaseKeystorePath != null && !releaseKeystorePath.isBlank()

android {
    namespace 'com.argatamauka.studentplanner'
    compileSdk 35

    defaultConfig {
        applicationId "com.argatamauka.studentplanner"
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName "2.2.4"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
