plugins {
    id 'com.android.application'
}

// permanent-release-trigger: 2.3.1

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def hasReleaseSigning = releaseKeystorePath != null && !releaseKeystorePath.isBlank()

android {
    namespace 'com.argatamauka.studentplanner'
    compileSdk 35

    defaultConfig {
        applicationId "com.argatamauka.studentplanner"
        minSdk 24
        targetSdk 35
        versionCode 17
        versionName "2.3.1"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}

def generatedWebAssets = file("$buildDir/generated/webAssets")

android.sourceSets.main.assets.srcDir(generatedWebAssets)

tasks.register("copyWebAssets", Copy) {
    from(file("${rootProject.projectDir}/..")) {
        include "index.html"
        include "style.css"
        include "script.js"
        include "supabase-config.js"
        include "offline.js"
        include "matakuliah.html"
        include "matakuliah.css"
        include "matakuliah.js"
        include "profil.html"
        include "profil.css"
        include "profil.js"
        include "pwa.js"
        include "sw.js"
        include "manifest.webmanifest"
        include "app-icon.svg"
    }
    into(generatedWebAssets)
}

tasks.named("preBuild").configure {
    dependsOn("copyWebAssets")
}
